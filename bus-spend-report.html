<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Type Spend Report</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

.header { background: #1a1a2e; color: white; padding: 20px 32px; border-bottom: 3px solid #4a90d9; }
.header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
.header p { font-size: 0.82rem; color: #8892b0; margin-top: 4px; }

.main { max-width: 1400px; margin: 0 auto; padding: 24px 32px; }

.card { background: white; border-radius: 10px; padding: 24px; margin-bottom: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.card h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 16px; color: #1a1a2e; text-transform: uppercase; letter-spacing: 0.05em; }

.upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.upload-box { border: 2px dashed #c8d0e0; border-radius: 8px; padding: 24px 20px; text-align: center; transition: all 0.2s; }
.upload-box label { display: block; cursor: pointer; }
.upload-box input[type=file] { display: none; }
.upload-box .icon { font-size: 2.2rem; margin-bottom: 10px; }
.upload-box .title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
.upload-box .hint { font-size: 0.76rem; color: #6b7280; line-height: 1.5; }
.upload-box .filename { font-size: 0.8rem; color: #4a90d9; margin-top: 8px; font-weight: 600; }
.upload-box.has-file { border-color: #4a90d9; background: #f5f9ff; }
.upload-box:not(.has-file):hover { border-color: #9ca3af; }

.btn { background: #1a1a2e; color: white; border: none; padding: 10px 28px; border-radius: 6px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: background 0.2s; letter-spacing: 0.02em; }
.btn:hover:not(:disabled) { background: #2d2d4e; }
.btn:disabled { background: #9ca3af; cursor: not-allowed; }
.btn.secondary { background: #4a90d9; }
.btn.secondary:hover:not(:disabled) { background: #3a7bc8; }

.status { font-size: 0.82rem; color: #6b7280; margin-top: 12px; padding: 8px 0; }
.status.error { color: #dc2626; }
.status.success { color: #059669; }
.status.loading { color: #d97706; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
thead th { background: #1a1a2e; color: white; padding: 10px 14px; text-align: right; white-space: nowrap; font-weight: 600; }
thead th:first-child, thead th:nth-child(2) { text-align: left; }
td { padding: 9px 14px; border-bottom: 1px solid #f0f2f5; text-align: right; }
td:first-child { text-align: left; font-weight: 600; }
td:nth-child(2) { text-align: center; color: #6b7280; }
tr:hover td { background: #f9fafb; }
.grand-row td { background: #f0f2f5; font-weight: 700; border-top: 2px solid #c8d0e0; color: #1a1a2e; }
.grand-row:hover td { background: #e8ecf0; }

.budget-controls { display: flex; gap: 16px; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 0.75rem; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.06em; }
select, input[type=number] { padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.88rem; min-width: 200px; background: white; color: #1a1a2e; }
select:focus, input[type=number]:focus { outline: 2px solid #4a90d9; border-color: transparent; }

.budget-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 14px; }
.budget-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; }
.budget-card .g-name { font-size: 0.72rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
.budget-card .amount { font-size: 1.35rem; font-weight: 700; color: #1a1a2e; }
.budget-card .per-bus { font-size: 0.74rem; color: #9ca3af; margin-top: 5px; }
.budget-card.total-card { background: #1a1a2e; border-color: #1a1a2e; grid-column: 1 / -1; display: flex; align-items: center; gap: 24px; }
.budget-card.total-card .g-name { color: #8892b0; margin: 0; font-size: 0.8rem; white-space: nowrap; }
.budget-card.total-card .amount { color: white; font-size: 2rem; }
.budget-card.total-card .per-bus { color: #8892b0; margin-top: 2px; }

.hidden { display: none !important; }
.subtitle { font-size: 0.8rem; color: #6b7280; margin-bottom: 16px; }

details.diag { border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 10px; }
details.diag summary { padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 0.82rem; list-style: none; display: flex; align-items: center; gap: 8px; }
details.diag summary::before { content: '▶'; font-size: 0.65rem; transition: transform 0.15s; }
details.diag[open] summary::before { transform: rotate(90deg); }
details.diag summary:hover { background: #f9fafb; border-radius: 6px; }
details.diag[open] summary { border-bottom: 1px solid #e2e8f0; border-radius: 6px 6px 0 0; }
.diag-body { padding: 14px 16px; }
.diag-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; margin: 14px 0 5px; }
.diag-label:first-child { margin-top: 0; }
.sheet-pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 0.74rem; background: #f0f2f5; margin: 2px; }
.sheet-pill.active { background: #1a1a2e; color: white; }
.diag-table { font-size: 0.75rem; border-collapse: collapse; max-width: 100%; overflow-x: auto; display: block; white-space: nowrap; }
.diag-table th { background: #f0f2f5; padding: 4px 10px; text-align: left; border: 1px solid #e2e8f0; }
.diag-table td { padding: 4px 10px; border: 1px solid #e2e8f0; }
.col-found { color: #059669; font-weight: 600; }
.col-missing { color: #dc2626; font-weight: 600; }
.diag-stat { display: inline-block; margin-right: 16px; font-size: 0.82rem; }
.diag-stat strong { color: #1a1a2e; }

.fleet-lines { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.fleet-line { display: flex; align-items: center; gap: 10px; }
.fleet-line select { min-width: 220px; flex: 0 0 auto; }
.fleet-line input[type=number] { min-width: 90px; width: 90px; flex: 0 0 auto; }
.fleet-line .line-label { font-size: 0.82rem; color: #6b7280; }
.remove-btn { background: none; border: 1px solid #e2e8f0; color: #9ca3af; border-radius: 4px; width: 28px; height: 28px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.remove-btn:hover { border-color: #dc2626; color: #dc2626; background: #fff5f5; }
.add-line-btn { background: none; border: 1px dashed #c8d0e0; color: #4a90d9; border-radius: 6px; padding: 8px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.add-line-btn:hover { border-color: #4a90d9; background: #f5f9ff; }
.budget-table td.total-col { font-weight: 700; background: #f8fafc; }
.budget-table tr.total-row td { background: #1a1a2e; color: white; font-weight: 700; }
.budget-table tr.total-row td.total-col { background: #111827; }
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="header">
  <h1>Bus Type Spend Report</h1>
  <p>Average annual spend per bus &mdash; by chassis type and cost category</p>
</div>
<div class="main">

  <div class="card">
    <h2>Upload Data</h2>
    <div class="upload-grid">
      <div class="upload-box" id="spendBox">
        <label for="spendFile">
          <div class="icon">📊</div>
          <div class="title">Spend Data</div>
          <div class="hint">One full year of transactions<br>.xlsx or .csv &mdash; Needs: FleetNumber, PLImpact, TransactionValue</div>
          <div class="filename" id="spendName">Click to select file</div>
          <input type="file" id="spendFile" accept=".xlsx,.xls,.xlsm,.csv">
        </label>
      </div>
      <div class="upload-box" id="fleetBox">
        <label for="fleetFile">
          <div class="icon">🚌</div>
          <div class="title">Fleet File</div>
          <div class="hint">Fleet Number &rarr; Chassis Variant<br>.xlsx or .csv &mdash; Two columns, headers required</div>
          <div class="filename" id="fleetName">Click to select file</div>
          <input type="file" id="fleetFile" accept=".xlsx,.xls,.xlsm,.csv">
        </label>
      </div>
    </div>
    <button class="btn" id="processBtn" disabled>Generate Report</button>
    <div class="status" id="status">Upload both files to continue.</div>
  </div>

  <div class="card hidden" id="diagCard">
    <h2>Diagnostics</h2>
    <div id="diagContent"></div>
  </div>

  <div class="card hidden" id="summaryCard">
    <h2>Average Annual Spend Per Bus</h2>
    <p class="subtitle" id="summarySubtitle"></p>
    <div class="table-wrap" id="tableWrap"></div>
  </div>

  <div class="card hidden" id="budgetCard">
    <h2>Budget Calculator</h2>
    <p class="subtitle">Add bus types and quantities to project your full fleet budget. Results update automatically.</p>
    <div class="fleet-lines" id="fleetLines"></div>
    <button class="add-line-btn" id="addLineBtn">+ Add Bus Type</button>
    <div class="table-wrap hidden" id="budgetResult" style="margin-top:24px"></div>
  </div>

</div>
<script>
const SPEND_GROUPS = {
  'Store Materials':        [331010, 331011, 331015, 331016],
  'Major Units':            [331020, 331021],
  '3rd Party Maintenance':  [331018],
  'Lubricants':             [331030],
  'Vehicle Tow & Recovery': [331041],
};

const CODE_TO_GROUP = {};
for (const [group, codes] of Object.entries(SPEND_GROUPS)) {
  for (const code of codes) CODE_TO_GROUP[code] = group;
}
const GROUP_NAMES = Object.keys(SPEND_GROUPS);

function parseCSV(text) {
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  const result = [];
  for (const line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let cur = '', inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuote && line[i + 1] === '"') { cur += '"'; i++; }
        else inQuote = !inQuote;
      } else if (ch === ',' && !inQuote) {
        row.push(cur.trim()); cur = '';
      } else { cur += ch; }
    }
    row.push(cur.trim());
    result.push(row);
  }
  return result;
}

function readDataFile(file) {
  const isCSV = /\.(csv)$/i.test(file.name);
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file: ' + file.name));
    reader.onload = e => {
      try {
        if (isCSV) {
          const rows = parseCSV(e.target.result);
          resolve({ rows, sheetInfo: [{ name: 'CSV', nonEmptyCount: rows.length - 1 }], selectedSheet: 'CSV' });
        } else {
          const wb = XLSX.read(e.target.result, { type: 'binary' });
          const sheetInfo = wb.SheetNames.map(name => {
            const ws = wb.Sheets[name];
            const r  = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            return { name, rawCount: r.length, nonEmptyCount: r.filter(row => row.some(c => c !== '')).length };
          });
          const ws  = wb.Sheets[wb.SheetNames[0]];
          const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
          const rows = raw
            .filter(row => row.some(c => c !== ''))
            .map(row => row.map(c => (c === null || c === undefined || c === '') ? '' : String(c).trim()));
          resolve({ rows, sheetInfo, selectedSheet: wb.SheetNames[0] });
        }
      } catch (err) {
        reject(new Error('Parse error: ' + err.message));
      }
    };
    isCSV ? reader.readAsText(file) : reader.readAsBinaryString(file);
  });
}

function buildFleetMap(rows) {
  if (rows.length < 2) throw new Error('Fleet file appears empty.');
  const headers = rows[0].map(h => h.toLowerCase().replace(/\s+/g, ''));
  const numIdx  = headers.findIndex(h => h.includes('fleetnumber') || h.includes('fleet'));
  const typeIdx = headers.findIndex(h => h.includes('chassis') || h.includes('variant') || h.includes('type') || h.includes('bus'));
  if (numIdx  === -1) throw new Error(`Fleet file: cannot find fleet number column. Headers found: ${rows[0].join(', ')}`);
  if (typeIdx === -1) throw new Error(`Fleet file: cannot find chassis/variant column. Headers found: ${rows[0].join(', ')}`);
  const map = new Map();
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const num  = (row[numIdx]  || '').trim();
    const type = (row[typeIdx] || '').trim();
    if (num && type) map.set(num, type);
  }
  if (map.size === 0) throw new Error('Fleet file: no data rows found after the header.');
  return map;
}

function processSpend(spendRows, fleetMap) {
  if (spendRows.length < 2) throw new Error('Spend file appears empty.');
  const headers = spendRows[0].map(h => h.trim());
  const hi = name => headers.findIndex(h => h.toLowerCase() === name.toLowerCase());

  const fleetIdx = hi('FleetNumber');
  const plIdx    = hi('PLImpact');
  const valIdx   = hi('TransactionValue');

  if (fleetIdx === -1) throw new Error(`Spend file: "FleetNumber" column not found. Check header row. Columns seen: ${headers.slice(0,5).join(', ')}...`);
  if (plIdx    === -1) throw new Error('Spend file: "PLImpact" column not found.');
  if (valIdx   === -1) throw new Error('Spend file: "TransactionValue" column not found.');

  const busData = {};
  let matched = 0, skippedNoFleet = 0, skippedNoGroup = 0;

  for (let i = 1; i < spendRows.length; i++) {
    const row = spendRows[i];
    const fleetNum = (row[fleetIdx] || '').trim();
    const plCode   = parseInt(row[plIdx],  10);
    const value    = parseFloat(row[valIdx]);

    if (!fleetNum || isNaN(plCode) || isNaN(value)) { skippedNoFleet++; continue; }

    const busType = fleetMap.get(fleetNum);
    const group   = CODE_TO_GROUP[plCode];

    if (!busType) { skippedNoGroup++; continue; }
    if (!group)   { continue; }

    if (!busData[busType])           busData[busType] = {};
    if (!busData[busType][fleetNum]) busData[busType][fleetNum] = {};
    busData[busType][fleetNum][group] = (busData[busType][fleetNum][group] || 0) + value;
    matched++;
  }

  if (Object.keys(busData).length === 0) {
    throw new Error(`No matched transactions. ${skippedNoFleet} rows had missing fleet/value. ${skippedNoGroup} fleet numbers not in fleet file. Check both files use the same fleet number format.`);
  }

  const averages = {};
  for (const [busType, buses] of Object.entries(busData)) {
    const busNums = Object.keys(buses);
    const n = busNums.length;
    averages[busType] = { _count: n };
    for (const group of GROUP_NAMES) {
      const total = busNums.reduce((s, bn) => s + (buses[bn][group] || 0), 0);
      averages[busType][group] = total / n;
    }
    averages[busType]._total = GROUP_NAMES.reduce((s, g) => s + averages[busType][g], 0);
  }
  return { averages, matched, skippedNoFleet, skippedNoGroup };
}
</script>
<script>
const fmt = v => {
  const abs = Math.abs(v).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (v < 0 ? '-' : '') + '£' + abs;
};

function renderTable(averages) {
  const types = Object.keys(averages).sort();
  let html = '<table><thead><tr>'
    + '<th>Bus Type</th><th>Buses in Sample</th>'
    + GROUP_NAMES.map(g => `<th>${g}</th>`).join('')
    + '<th>Total per Bus</th></tr></thead><tbody>';

  for (const t of types) {
    const d = averages[t];
    html += `<tr><td>${t}</td><td>${d._count}</td>`
      + GROUP_NAMES.map(g => `<td>${fmt(d[g])}</td>`).join('')
      + `<td><strong>${fmt(d._total)}</strong></td></tr>`;
  }

  const totalBuses = types.reduce((s, t) => s + averages[t]._count, 0);
  const grandGroup = GROUP_NAMES.map(g => {
    const wtd = types.reduce((s, t) => s + averages[t][g] * averages[t]._count, 0);
    return wtd / totalBuses;
  });
  const grandTotal = grandGroup.reduce((s, v) => s + v, 0);

  html += `<tr class="grand-row"><td>Fleet Average</td><td>${totalBuses}</td>`
    + grandGroup.map(v => `<td>${fmt(v)}</td>`).join('')
    + `<td><strong>${fmt(grandTotal)}</strong></td></tr>`;

  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;
}

let _lineId = 0;

function makeSelect() {
  const sel = document.createElement('select');
  if (_averages) {
    Object.keys(_averages).sort().forEach(t => {
      const o = document.createElement('option');
      o.value = t;
      o.textContent = `${t}  (${_averages[t]._count} in sample)`;
      sel.appendChild(o);
    });
  }
  sel.addEventListener('change', renderFleetBudget);
  return sel;
}

function addFleetLine() {
  const id = ++_lineId;
  const line = document.createElement('div');
  line.className = 'fleet-line';
  line.dataset.lineId = id;

  const sel = makeSelect();
  const countInput = document.createElement('input');
  countInput.type = 'number'; countInput.min = 1; countInput.max = 9999; countInput.value = 1;
  countInput.addEventListener('input', renderFleetBudget);

  const label = document.createElement('span');
  label.className = 'line-label'; label.textContent = 'buses';

  const removeBtn = document.createElement('button');
  removeBtn.className = 'remove-btn'; removeBtn.textContent = '×'; removeBtn.title = 'Remove';
  removeBtn.addEventListener('click', () => { line.remove(); renderFleetBudget(); });

  line.append(sel, countInput, label, removeBtn);
  document.getElementById('fleetLines').appendChild(line);
  renderFleetBudget();
}

function renderFleetBudget() {
  if (!_averages) return;
  const lines = [...document.querySelectorAll('#fleetLines .fleet-line')].map(line => ({
    busType: line.querySelector('select').value,
    count:   Math.max(1, parseInt(line.querySelector('input').value, 10) || 1),
  })).filter(l => l.busType && _averages[l.busType]);

  const result = document.getElementById('budgetResult');
  if (lines.length === 0) { result.classList.add('hidden'); return; }

  let html = '<table class="budget-table" style="width:100%;border-collapse:collapse;font-size:0.83rem"><thead><tr>'
    + '<th style="text-align:left;padding:9px 14px;background:#1a1a2e;color:white;white-space:nowrap">Spend Category</th>';
  for (const l of lines) {
    html += `<th style="padding:9px 14px;background:#1a1a2e;color:white;text-align:right;white-space:nowrap">${l.busType}<br><span style="font-weight:400;font-size:0.7rem;color:#8892b0">&times; ${l.count} bus${l.count !== 1 ? 'es' : ''}</span></th>`;
  }
  html += '<th style="padding:9px 14px;background:#0f172a;color:white;text-align:right;white-space:nowrap">Fleet Total</th></tr></thead><tbody>';

  for (const g of GROUP_NAMES) {
    const fleetTotal = lines.reduce((s, l) => s + _averages[l.busType][g] * l.count, 0);
    html += `<tr><td style="padding:9px 14px;border-bottom:1px solid #f0f2f5;font-weight:500">${g}</td>`;
    for (const l of lines) html += `<td style="padding:9px 14px;border-bottom:1px solid #f0f2f5;text-align:right">${fmt(_averages[l.busType][g] * l.count)}</td>`;
    html += `<td class="total-col" style="padding:9px 14px;border-bottom:1px solid #f0f2f5;text-align:right">${fmt(fleetTotal)}</td></tr>`;
  }

  html += '<tr class="total-row"><td style="padding:10px 14px">Total</td>';
  for (const l of lines) {
    html += `<td style="padding:10px 14px;text-align:right">${fmt(_averages[l.busType]._total * l.count)}</td>`;
  }
  const grandTotal = lines.reduce((s, l) => s + _averages[l.busType]._total * l.count, 0);
  html += `<td class="total-col" style="padding:10px 14px;text-align:right">${fmt(grandTotal)}</td></tr>`;
  html += '</tbody></table>';

  result.innerHTML = html;
  result.classList.remove('hidden');
}

let _averages = null;

function setStatus(msg, cls = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + cls;
}

function checkReady() {
  document.getElementById('processBtn').disabled = !(_spendFile && _fleetFile);
  if (_spendFile && _fleetFile) setStatus('Both files loaded. Click Generate Report.', '');
}

let _spendFile = null, _fleetFile = null;

document.getElementById('spendFile').addEventListener('change', e => {
  _spendFile = e.target.files[0] || null;
  const nameEl = document.getElementById('spendName');
  nameEl.textContent = _spendFile ? _spendFile.name : 'Click to select file';
  document.getElementById('spendBox').classList.toggle('has-file', !!_spendFile);
  checkReady();
});

document.getElementById('fleetFile').addEventListener('change', e => {
  _fleetFile = e.target.files[0] || null;
  const nameEl = document.getElementById('fleetName');
  nameEl.textContent = _fleetFile ? _fleetFile.name : 'Click to select file';
  document.getElementById('fleetBox').classList.toggle('has-file', !!_fleetFile);
  checkReady();
});

document.getElementById('processBtn').addEventListener('click', async () => {
  setStatus('Reading Excel files…', 'loading');
  document.getElementById('processBtn').disabled = true;
  let spendResult = null, fleetResult = null;
  try {
    [spendResult, fleetResult] = await Promise.all([readDataFile(_spendFile), readDataFile(_fleetFile)]);
    const spendRows = spendResult.rows;
    const fleetRows = fleetResult.rows;
    setStatus('Processing…', 'loading');
    const fleetMap  = buildFleetMap(fleetRows);
    const { averages, matched, skippedNoFleet, skippedNoGroup } = processSpend(spendRows, fleetMap);
    _averages = averages;

    renderDiagnostics(spendResult, fleetResult, spendRows, { matched, skippedNoFleet, skippedNoGroup });

    const typeCount = Object.keys(averages).length;
    document.getElementById('summarySubtitle').textContent =
      `${typeCount} bus type${typeCount !== 1 ? 's' : ''} · ${fleetMap.size.toLocaleString()} vehicles in fleet file · ${matched.toLocaleString()} spend lines matched`;

    renderTable(averages);
    if (document.querySelectorAll('#fleetLines .fleet-line').length === 0) {
      addFleetLine();
    } else {
      document.querySelectorAll('#fleetLines select').forEach(sel => {
        const cur = sel.value;
        sel.innerHTML = '';
        Object.keys(averages).sort().forEach(t => {
          const o = document.createElement('option');
          o.value = t; o.textContent = `${t}  (${averages[t]._count} in sample)`;
          sel.appendChild(o);
        });
        if (cur) sel.value = cur;
      });
      renderFleetBudget();
    }

    document.getElementById('summaryCard').classList.remove('hidden');
    document.getElementById('budgetCard').classList.remove('hidden');
    document.getElementById('summaryCard').scrollIntoView({ behavior: 'smooth', block: 'start' });

    const warn = skippedNoGroup > 0 ? ` (${skippedNoGroup.toLocaleString()} fleet numbers not in fleet file — check both files match)` : '';
    setStatus(`Done — ${typeCount} bus type${typeCount !== 1 ? 's' : ''} found.${warn}`, 'success');
  } catch (err) {
    if (spendResult || fleetResult) renderDiagnostics(spendResult, fleetResult, spendResult ? spendResult.rows : null, null);
    setStatus('Error: ' + err.message, 'error');
    console.error(err);
  } finally {
    document.getElementById('processBtn').disabled = false;
  }
});

document.getElementById('addLineBtn').addEventListener('click', addFleetLine);

function renderDiagnostics(spendResult, fleetResult, spendRows, stats) {
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function fileSection(label, result, isSpend) {
    if (!result) return `<details class="diag"><summary>${label} — not read yet</summary></details>`;
    const { rows, sheetInfo, selectedSheet } = result;

    const sheetPills = sheetInfo.map(s =>
      `<span class="sheet-pill${s.name === selectedSheet ? ' active' : ''}">${esc(s.name)} (${s.nonEmptyCount.toLocaleString()} rows)</span>`
    ).join('');

    const headers = rows.length > 0 ? rows[0] : [];
    const headerList = headers.length
      ? headers.slice(0, 15).map(h => `<code>${esc(h)}</code>`).join(' · ') + (headers.length > 15 ? ` <em>…+${headers.length - 15} more</em>` : '')
      : '<em>No headers found</em>';

    let colDetect = '';
    if (isSpend && rows.length > 0) {
      const hi = name => headers.findIndex(h => h.toLowerCase() === name.toLowerCase());
      const cols = [
        { name: 'FleetNumber',      idx: hi('FleetNumber') },
        { name: 'PLImpact',         idx: hi('PLImpact') },
        { name: 'TransactionValue', idx: hi('TransactionValue') },
      ];
      colDetect = `<div class="diag-label">Key column detection</div>`
        + cols.map(c => c.idx === -1
          ? `<span class="diag-stat"><span class="col-missing">✗ ${esc(c.name)}</span> — not found</span>`
          : `<span class="diag-stat"><span class="col-found">✓ ${esc(c.name)}</span> at column ${c.idx + 1}</span>`
        ).join('');
    }

    let previewHtml = '';
    if (rows.length > 0) {
      const cols = Math.min(headers.length, 8);
      const previewRows = rows.slice(0, 4);
      previewHtml = `<div class="diag-label">Data preview (first ${previewRows.length - 1} rows, first ${cols} columns)</div>`
        + `<table class="diag-table"><thead><tr>${headers.slice(0, cols).map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`
        + previewRows.slice(1).map(r => `<tr>${r.slice(0, cols).map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')
        + `</tbody></table>`;
    }

    let statsHtml = '';
    if (isSpend && stats) {
      statsHtml = `<div class="diag-label">Match statistics</div>`
        + `<span class="diag-stat">Matched: <strong>${stats.matched.toLocaleString()}</strong></span>`
        + `<span class="diag-stat">Skipped (bad data): <strong>${stats.skippedNoFleet.toLocaleString()}</strong></span>`
        + `<span class="diag-stat">Fleet number not in fleet file: <strong>${stats.skippedNoGroup.toLocaleString()}</strong></span>`;
    }

    const rowCount = rows.length > 0 ? rows.length - 1 : 0;
    const ok = rows.length >= 2;
    return `<details class="diag"${!ok ? ' open' : ''}>
      <summary>${label} — ${ok ? `<span class="col-found">${rowCount.toLocaleString()} data rows read</span>` : `<span class="col-missing">0 rows read — check file</span>`}</summary>
      <div class="diag-body">
        <div class="diag-label">Sheets in workbook</div>${sheetPills}
        <div class="diag-label">Headers detected (first 15)</div><div>${headerList}</div>
        ${colDetect}
        ${previewHtml}
        ${statsHtml}
      </div>
    </details>`;
  }

  const html = fileSection('Spend Data', spendResult, true)
             + fileSection('Fleet File', fleetResult, false);

  document.getElementById('diagContent').innerHTML = html;
  document.getElementById('diagCard').classList.remove('hidden');
}
</script>
</body>
</html>
